apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-all

spec:
  ingressClassName: nginx

  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: online-shop-service
                port:
                  number: 3000

          - path: /apache
            pathType: Prefix
            backend:
              service:
                name: apache-service
                port:
                  number: 80

          - path: /nginx
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80