kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

---

kind: Service
apiVersion: v1
metadata:
  name: nginx-service

spec:
  selector:
    app: nginx
  
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP